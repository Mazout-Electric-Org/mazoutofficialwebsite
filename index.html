<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Page-specific tags (description, keywords, robots, canonical, JSON-LD beyond
      Organization) are owned exclusively by the <SEO> component (react-helmet-async)
      so each route gets exactly one of each — do not duplicate them here. Googlebot
      renders JS and reads the Helmet-managed <head> for those.

      OG/Twitter tags are the one exception kept here as a static, site-wide
      fallback: link-preview crawlers (Facebook/Twitter/LinkedIn/Slack/WhatsApp
      unfurlers) fetch raw HTML and never execute JS, so they only ever see this
      block regardless of which page was shared. <SEO> still overrides these with
      page-specific values for the (rarer) tools that do render JS; the two don't
      conflict in practice since the two audiences never overlap.
    -->
    <title>Mazout Electric | Zooty — Autonomous EV & Training Platform</title>
    <meta name="author" content="Mazout Electric" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mazout Electric | Zooty — EV for Logistics, Patrolling & Bike Taxi" />
    <meta property="og:description" content="Zooty by Mazout Electric — one electric vehicle, three use cases. Built for last-mile logistics, campus patrolling, and bike taxi operations across India." />
    <meta property="og:image" content="https://mazoutelectric.com/og-image.jpg" />
    <meta property="og:url" content="https://mazoutelectric.com/" />
    <meta property="og:site_name" content="Mazout Electric" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ElectricMazout" />
    <meta name="twitter:title" content="Mazout Electric | Zooty — EV for Logistics, Patrolling & Bike Taxi" />
    <meta name="twitter:description" content="Zooty by Mazout Electric — one electric vehicle, three use cases. Last-mile logistics, campus patrolling, and bike taxi." />
    <meta name="twitter:image" content="https://mazoutelectric.com/og-image.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Structured Data: Organization — identity is the same on every page, so it's safe to keep static. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Mazout Electric",
      "url": "https://mazoutelectric.com/",
      "logo": "https://mazoutelectric.com/og-image.jpg",
      "sameAs": [
        "https://www.linkedin.com/company/mazout-electric/posts/?feedView=all",
        "https://x.com/ElectricMazout/",
        "https://www.instagram.com/zootyev/",
        "https://www.youtube.com/@mazoutelectric2117",
        "https://wellfound.com/company/mazout-electric"
      ],
      "description": "Mazout Electric builds Zooty — a multi-purpose electric vehicle for logistics, patrolling, and bike taxi operations in India."
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
